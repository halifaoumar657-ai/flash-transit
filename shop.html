<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue - Flash Transit</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-zinc-100 text-zinc-900 font-sans">

  <!-- HEADER -->
  <header class="bg-white border-b border-zinc-200 py-3 px-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2">
        <div class="bg-orange-500 text-white font-black px-3 py-1.5 rounded-lg text-xl tracking-wider shadow">
          FLASH<span class="text-zinc-900">TRANSIT</span>
        </div>
      </a>
      <nav class="hidden md:flex space-x-8 font-semibold text-sm">
        <a href="index.html" class="hover:text-orange-500">Accueil</a>
        <a href="shop.html" class="text-orange-500 font-bold border-b-2 border-orange-500 pb-1">Catalogue</a>
        <a href="tracking.html" class="hover:text-orange-500">Suivi Colis</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-black mb-6">Catalogue des arrivages</h1>
    <div id="shop-products-container" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('shop-products-container');
      container.innerHTML = PRODUCTS_DATA.map(p => `
        <div class="bg-white rounded-2xl border border-zinc-200 overflow-hidden mall-card flex flex-col justify-between p-4">
          <img src="${p.image}" class="w-full h-44 object-cover rounded-xl mb-3">
          <h4 class="font-bold text-sm">${p.name}</h4>
          <span class="font-extrabold text-orange-600 my-2">${formatPrice(p.priceXOF, p.priceKMF)}</span>
          <button onclick="contactWhatsApp('Bonjour, je souhaite commander : ${encodeURIComponent(p.name)}')" class="bg-zinc-900 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2">
            <i class="fa-brands fa-whatsapp text-emerald-400"></i> Commander
          </button>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
