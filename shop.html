<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue - Flash Transit</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { dark: '#0d0f12', card: '#161920', border: '#232732', pink: '#e91e63' }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-brand-dark text-slate-100 font-sans">

  <!-- HEADER -->
  <header class="bg-brand-card border-b border-brand sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2">
        <div class="bg-brand-pink text-white px-3 py-1.5 rounded-xl font-black text-xl tracking-wider pink-glow">
          FLASH TRANSIT
        </div>
      </a>
      <nav class="hidden md:flex space-x-8 font-semibold text-sm">
        <a href="index.html" class="hover:text-brand-pink">Accueil</a>
        <a href="shop.html" class="text-brand-pink font-bold border-b-2 border-brand-pink pb-1">Catalogue & Planning</a>
        <a href="tracking.html" class="hover:text-brand-pink">Suivi de Transit</a>
      </nav>
      <a href="cart.html" class="relative p-2.5 bg-brand-dark rounded-xl border border-brand text-slate-200">
        <i class="fa-solid fa-bag-shopping text-lg"></i>
        <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-brand-pink text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid lg:grid-cols-4 gap-8">
      <!-- FILTRES -->
      <aside class="space-y-6">
        <div class="bg-brand-card p-5 rounded-2xl border border-brand">
          <h3 class="font-bold text-white text-sm uppercase mb-3 flex justify-between">
            <span>Planning</span>
            <i class="fa-solid fa-calendar-days text-brand-pink"></i>
          </h3>
          <div class="space-y-1.5 text-sm" id="day-filters">
            <button onclick="setDayFilter('all')" class="day-btn w-full text-left px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-brand-dark transition" data-day="all">Tous les jours</button>
            <button onclick="setDayFilter('lundi')" class="day-btn w-full text-left px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-brand-dark transition" data-day="lundi">Lundi - High-Tech</button>
            <button onclick="setDayFilter('mardi')" class="day-btn w-full text-left px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-brand-dark transition" data-day="mardi">Mardi - Bijoux</button>
            <button onclick="setDayFilter('mercredi')" class="day-btn w-full text-left px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-brand-dark transition" data-day="mercredi">Mercredi - Mode Homme</button>
            <button onclick="setDayFilter('jeudi')" class="day-btn w-full text-left px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-brand-dark transition" data-day="jeudi">Jeudi - Sacs & Chaussures</button>
            <button onclick="setDayFilter('vendredi')" class="day-btn w-full text-left px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-brand-dark transition" data-day="vendredi">Vendredi - Cosmétiques</button>
          </div>
        </div>
      </aside>

      <!-- PRODUITS -->
      <section class="lg:col-span-3">
        <div id="shop-products-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>
    </div>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let currentDay = 'all';
    function setDayFilter(day) {
      currentDay = day;
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.remove('bg-brand-pink', 'text-white');
        if (btn.getAttribute('data-day') === day) btn.classList.add('bg-brand-pink', 'text-white');
      });
      renderShop();
    }

    function renderShop() {
      const container = document.getElementById('shop-products-container');
      let list = currentDay === 'all' ? PRODUCTS_DATA : PRODUCTS_DATA.filter(p => p.day === currentDay);

      container.innerHTML = list.map(p => `
        <div class="bg-brand-card rounded-2xl overflow-hidden border border-brand pink-glow-hover flex flex-col justify-between">
          <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-extrabold text-brand-pink uppercase block mb-1">${p.dayLabel}</span>
              <h4 class="font-bold text-white text-sm">${p.name}</h4>
            </div>
            <div class="mt-4 pt-3 border-t border-brand flex items-center justify-between">
              <span class="font-black text-brand-pink text-sm">${formatPrice(p.priceXOF, p.priceKMF)}</span>
              <button onclick="addToCart('${p.id}')" class="bg-brand-pink text-white p-2.5 rounded-xl font-bold">
                <i class="fa-solid fa-cart-plus"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => { setDayFilter('all'); });
  </script>
</body>
</html>
