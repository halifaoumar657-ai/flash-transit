<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation de Commande - Flash Transit</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0d0f12',
              card: '#161920',
              border: '#232732',
              pink: '#e91e63',
              'pink-hover': '#d81b60'
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased">

  <!-- HEADER -->
  <header class="bg-brand-card border-b border-brand sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2">
        <div class="bg-brand-pink text-white px-3 py-1.5 rounded-xl font-black text-xl tracking-wider pink-glow">
          FLASH TRANSIT
        </div>
      </a>
      <span class="text-xs font-bold text-slate-400 uppercase">Commande Sécurisée</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-black text-white mb-2">Finaliser la commande</h1>
    <p class="text-slate-400 text-sm mb-8">Coordonnées de livraison et confirmation sur WhatsApp.</p>

    <form id="checkout-form" onsubmit="submitOrder(event)" class="grid md:grid-cols-2 gap-8">
      
      <!-- Formulaire Destinataire -->
      <div class="bg-brand-card p-6 rounded-2xl border border-brand space-y-4 shadow-xl">
        <h3 class="font-bold text-white text-base border-b border-brand pb-3">1. Informations de Livraison</h3>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Nom Complet *</label>
          <input type="text" id="fullname" required placeholder="Ex: Moussa Ali" class="w-full bg-brand-dark border border-brand text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-pink">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Téléphone / WhatsApp *</label>
          <input type="tel" id="phone" required placeholder="Ex: +221 77 000 00 00" class="w-full bg-brand-dark border border-brand text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-pink">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Destination *</label>
          <select id="country-select" onchange="updatePaymentOptions()" class="w-full bg-brand-dark border border-brand text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-pink font-bold">
            <option value="SN">🇸🇳 Sénégal (Dakar & Régions)</option>
            <option value="KM">🇰🇲 Comores (Moroni / Anjouan / Mohéli)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Adresse / Agence de retrait</label>
          <input type="text" id="address" required placeholder="Ex: Sacré-Cœur 3 ou Agence Moroni" class="w-full bg-brand-dark border border-brand text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-pink">
        </div>
      </div>

      <!-- Mode de Paiement & Confirmation -->
      <div class="bg-brand-card p-6 rounded-2xl border border-brand space-y-6 flex flex-col justify-between shadow-xl">
        <div>
          <h3 class="font-bold text-white text-base border-b border-brand pb-3 mb-4">2. Mode de Paiement</h3>
          <div class="space-y-3" id="payment-methods"></div>
        </div>

        <div>
          <div class="bg-brand-dark p-4 rounded-xl border border-brand mb-4">
            <div class="flex justify-between items-center text-sm font-bold">
              <span class="text-slate-300">Total Commande :</span>
              <span id="checkout-total" class="text-brand-pink text-lg font-black">0 FCFA</span>
            </div>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md">
            <i class="fa-brands fa-whatsapp text-lg"></i> Envoyer sur WhatsApp
          </button>
        </div>
      </div>

    </form>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function updatePaymentOptions() {
      const country = document.getElementById('country-select').value;
      const container = document.getElementById('payment-methods');
      
      if (country === 'SN') {
        container.innerHTML = `
          <label class="flex items-center justify-between p-3 border border-brand rounded-xl cursor-pointer hover:border-brand-pink transition bg-brand-dark">
            <div class="flex items-center space-x-3">
              <input type="radio" name="payment" value="Wave / Orange Money" checked class="text-brand-pink focus:ring-brand-pink">
              <span class="font-bold text-sm text-white">Wave / Orange Money</span>
            </div>
            <span class="text-[10px] bg-sky-500/20 text-sky-400 font-bold px-2 py-0.5 rounded">Mobile Money</span>
          </label>
          <label class="flex items-center justify-between p-3 border border-brand rounded-xl cursor-pointer hover:border-brand-pink transition bg-brand-dark">
            <div class="flex items-center space-x-3">
              <input type="radio" name="payment" value="Acompte / Espèces Agence Dakar" class="text-brand-pink focus:ring-brand-pink">
              <span class="font-bold text-sm text-white">Paiement à l'Agence Dakar</span>
            </div>
            <span class="text-[10px] bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded">Espèces</span>
          </label>
        `;
      } else {
        container.innerHTML = `
          <label class="flex items-center justify-between p-3 border border-brand rounded-xl cursor-pointer hover:border-brand-pink transition bg-brand-dark">
            <div class="flex items-center space-x-3">
              <input type="radio" name="payment" value="Holo-Mvola / Naissa" checked class="text-brand-pink focus:ring-brand-pink">
              <span class="font-bold text-sm text-white">Holo-Mvola / Naissa Pay</span>
            </div>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded">Comores Pay</span>
          </label>
          <label class="flex items-center justify-between p-3 border border-brand rounded-xl cursor-pointer hover:border-brand-pink transition bg-brand-dark">
            <div class="flex items-center space-x-3">
              <input type="radio" name="payment" value="Espèces Agence Moroni" class="text-brand-pink focus:ring-brand-pink">
              <span class="font-bold text-sm text-white">Paiement à l'Agence Moroni</span>
            </div>
            <span class="text-[10px] bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded">Espèces</span>
          </label>
        `;
      }

      let totalXOF = 0;
      let totalKMF = 0;
      AppState.cart.forEach(item => {
        totalXOF += item.priceXOF * item.quantity;
        totalKMF += item.priceKMF * item.quantity;
      });

      document.getElementById('checkout-total').textContent = (country === 'KM') ? `${totalKMF.toLocaleString('fr-FR')} KMF` : `${totalXOF.toLocaleString('fr-FR')} FCFA`;
    }

    function submitOrder(event) {
      event.preventDefault();

      if (AppState.cart.length === 0) {
        alert("Votre panier est vide.");
        return;
      }

      const fullname = document.getElementById('fullname').value;
      const phone = document.getElementById('phone').value;
      const country = document.getElementById('country-select').value === 'SN' ? 'Sénégal 🇸🇳' : 'Comores 🇰🇲';
      const address = document.getElementById('address').value;
      const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

      let summary = AppState.cart.map(item => `- ${item.name} (x${item.quantity})`).join('\n');
      let totalFormatted = document.getElementById('checkout-total').textContent;

      let message = `*NOUVELLE COMMANDE - FLASH TRANSIT*\n\n` +
                    `*Client :* ${fullname}\n` +
                    `*Téléphone :* ${phone}\n` +
                    `*Destination :* ${country}\n` +
                    `*Adresse/Agence :* ${address}\n` +
                    `*Moyen de Paiement :* ${paymentMethod}\n\n` +
                    `*ARTICLES COMMANDÉS :*\n${summary}\n\n` +
                    `*TOTAL ESTIMÉ :* ${totalFormatted}\n\n` +
                    `Merci de me transmettre les modalités d'importation et le récépissé.`;

      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');

      localStorage.removeItem('ft_cart');
      AppState.cart = [];
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('country-select').value = AppState.country;
      updatePaymentOptions();
    });
  </script>
</body>
</html>
